# dsh-client-ui-browser-panel bundle patch: loopback RPC plus the optional
# browser-session adapter. The row requires only `connection`; it waits for the
# optional `browser` service to install authenticated DSH navigation and still
# degrades to `available: false` when dsh-browser is not installed.
- insert:
    - id: ui-browser-panel
      name: '@deepseek-ai/dsh-client-ui-browser-panel'
      inject: [connection]
