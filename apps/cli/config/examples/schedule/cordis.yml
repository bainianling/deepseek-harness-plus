# Opt-in Schedule patch over the shipped Web composition. The owner observes
# only roots published after this overlay loads.

- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        # Avoid a new timestamp message on every tool-loop step while preserving
        # a fresh reading at least once per minute for this opt-in schedule overlay.
        refreshIntervalMs: 60000

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
